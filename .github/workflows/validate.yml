name: Website validation
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - run: find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
      - run: python python/build.py
      - run: python python/validate_content.py
      - run: python python/validate_assets.py
      - run: python -m unittest discover -s tests -v
      - name: Reject scripts and forms
        run: '! grep -RInE "<script|<form|onsubmit=|javascript:" --include="*.php" .'