<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 315" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">Delivery process</title><desc id="svg-desc">Five-stage iterative process: understand, architect, build, validate, and improve.</desc><rect width="700" height="315" fill="#111a20"/><g fill="#182932" stroke="#35505b"><rect x="34" y="136" width="112" height="48"/><rect x="164" y="136" width="112" height="48"/><rect x="294" y="136" width="112" height="48" stroke="#67d5f4"/><rect x="424" y="136" width="112" height="48"/><rect x="554" y="136" width="112" height="48"/></g><g fill="none" stroke="#67d5f4" stroke-width="1.5"><path d="M146 160H164M276 160H294M406 160H424M536 160H554"/><path d="M159 155l5 5-5 5M289 155l5 5-5 5M419 155l5 5-5 5M549 155l5 5-5 5"/><path d="M610 184V230H90V184" stroke="#35505b" stroke-dasharray="5 5"/></g><g fill="#e8f1f4" font-family="system-ui,sans-serif" font-size="10" font-weight="600" text-anchor="middle"><text x="90" y="164">UNDERSTAND</text><text x="220" y="164">ARCHITECT</text><text x="350" y="164">BUILD</text><text x="480" y="164">VALIDATE</text><text x="610" y="164">IMPROVE</text><text x="350" y="260" fill="#9db1bb" font-size="12" font-weight="400">Feedback informs the next iteration</text></g></svg>