<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Connected technology architecture</title><desc id="desc">Six layers show applications, AI, runtimes, cloud, operating systems, and hardware.</desc><rect width="1200" height="620" fill="#101820"/><g font-family="Arial,sans-serif"><text x="54" y="56" fill="#66d7ee" font-size="12">SYSTEM LANDSCAPE / CONCEPTUAL MODEL</text><text x="54" y="86" fill="#a6bbc4" font-size="16">Interfaces and constraints cross every layer</text><g fill="#162832" stroke="#5a9cad"><rect x="54" y="125" width="1092" height="58"/><rect x="54" y="202" width="1092" height="58"/><rect x="54" y="279" width="1092" height="58"/><rect x="54" y="356" width="1092" height="58"/><rect x="54" y="433" width="1092" height="58"/><rect x="54" y="510" width="1092" height="58"/></g><g fill="#e7f5f8" font-size="17"><text x="78" y="161">Applications &amp; product workflows</text><text x="78" y="238">AI / machine learning workloads</text><text x="78" y="315">Software runtimes &amp; APIs</text><text x="78" y="392">Cloud &amp; deployment infrastructure</text><text x="78" y="469">Operating systems &amp; resource management</text><text x="78" y="546">Compute hardware &amp; accelerators</text></g><g fill="#9db5bf" font-size="12" text-anchor="end"><text x="1110" y="160">USER VALUE / BUSINESS RULES</text><text x="1110" y="237">MODELS / INFERENCE</text><text x="1110" y="314">COMPATIBILITY / OBSERVABILITY</text><text x="1110" y="391">NETWORK / STORAGE / SECURITY</text><text x="1110" y="468">MEMORY / SCHEDULING / DRIVERS</text><text x="1110" y="545">CPU / GPU / MEMORY / I/O</text></g></g></svg>