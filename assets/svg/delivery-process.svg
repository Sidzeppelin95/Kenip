<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc"><title id="title">Five-step delivery process</title><desc id="desc">Understand, architect, build, validate, and improve as an iterative lifecycle.</desc><rect width="1200" height="300" fill="#111b22"/><g stroke="#66d7ee" stroke-opacity=".65" fill="none"><path d="M185 137H264m-8-6 8 6-8 6M421 137h79m-8-6 8 6-8 6M657 137h79m-8-6 8 6-8 6M893 137h79m-8-6 8 6-8 6"/></g><g fill="#162a34" stroke="#5a98aa"><rect x="28" y="82" width="157" height="112"/><rect x="264" y="82" width="157" height="112"/><rect x="500" y="82" width="157" height="112"/><rect x="736" y="82" width="157" height="112"/><rect x="972" y="82" width="200" height="112"/></g><g fill="#66d7ee" font-family="Arial,sans-serif" font-size="11"><text x="44" y="106">01</text><text x="280" y="106">02</text><text x="516" y="106">03</text><text x="752" y="106">04</text><text x="988" y="106">05</text></g><g fill="#f0fbfd" font-family="Arial,sans-serif" font-size="18" text-anchor="middle"><text x="106" y="142">Understand</text><text x="342" y="142">Architect</text><text x="578" y="142">Build</text><text x="814" y="142">Validate</text><text x="1072" y="142">Improve</text></g><text x="600" y="264" fill="#6c8a96" font-family="Arial,sans-serif" font-size="10" text-anchor="middle">ITERATIVE BY DESIGN</text></svg>